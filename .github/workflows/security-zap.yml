name: OWASP ZAP Vulnerability Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  zap-scan:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: plancraft
          POSTGRES_PASSWORD: plancraft_pass
          POSTGRES_DB: plancraft_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'

    - name: Install Backend Dependencies
      run: |
        cd backend
        pip install -r requirements.txt

    - name: Create Backend .env File
      run: |
        cat <<EOF > backend/.env
        DATABASE_URL=postgresql+asyncpg://plancraft:plancraft_pass@127.0.0.1:5432/plancraft_db
        REDIS_URL=redis://127.0.0.1:6379/0
        JWT_SECRET=supersecretkey123
        JWT_ALGORITHM=HS256
        EOF

    - name: Start Backend Server
      run: |
        cd backend
        nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &

    - name: Wait for API to be Ready
      run: |
        python -c "
        import socket, time
        port = 8000
        start_time = time.time()
        while True:
            try:
                s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                s.settimeout(1)
                s.connect(('127.0.0.1', port))
                s.close()
                print(f'API Port {port} is open and ready.')
                break
            except Exception:
                if time.time() - start_time > 60:
                    raise TimeoutError(f'Timed out waiting for port {port}')
                print(f'Waiting for port {port}...')
                time.sleep(2)
        "

    - name: Pull OWASP ZAP Docker Image
      run: |
        docker pull -q zaproxy/zap-stable:latest

    - name: Run OWASP ZAP Baseline Scan
      run: |
        mkdir -p zap-reports
        # Run ZAP scan using host network to access localhost on runner
        docker run --user root --network="host" -v $(pwd)/zap-reports:/zap/wrk/:rw -t zaproxy/zap-stable:latest zap-baseline.py -t http://localhost:8000/api -r zap_report.html || true
        # Make sure report was created
        ls -la zap-reports

    - name: Upload ZAP Scan Report
      uses: actions/upload-artifact@v4
      with:
        name: owasp-zap-report
        path: zap-reports/zap_report.html

    - name: Dump Backend Server Logs (On Failure)
      if: always()
      run: |
        echo "========================================================="
        echo "                DETAILED BACKEND LOGS                    "
        echo "========================================================="
        if [ -f backend.log ]; then
          cat backend.log
        else
          echo "backend.log not found"
        fi
